<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>長按游標常駐提示 · 六款候選</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#dceefa;font:15px system-ui}main{max-width:1400px;margin:auto;padding:32px 24px}h1{font-size:24px;font-weight:500}h2{font-size:17px;font-weight:500}p,small{color:#9ab1bf;line-height:1.6}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button{background:#122934;color:#c5edfa;border:1px solid #547784;padding:12px 18px;cursor:pointer}button:focus{outline:none}button:focus-visible,button[aria-pressed=true]{box-shadow:inset 0 0 12px #86d8f255;color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}section{min-width:0}canvas{display:block;width:100%;height:280px;background:radial-gradient(ellipse at top left,#86d8f218,transparent 65%),repeating-linear-gradient(135deg,transparent 0 25px,#86d8f20b 26px 27px),#0a1922;border-block:1px solid #86d8f240}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style>
<main><small>ECHOES / HOLD INDICATOR</small><h1>長按游標 · 常駐提示六款候選</h1><div class="controls"><button id="motion" aria-pressed="true">浮動示意：開</button><button id="cursor" aria-pressed="true">顯示 06 游標</button></div><div class="grid"></div><p>每欄左側 1×、右側 3×。上方為長按提示，下方為目前菱形游標；保持顯示，沒有消失動畫。僅外觀預覽，不啟動遊戲、不修改主專案。</p></main>
<script>
const titles=['等長 V 形','雙層下引','切角下箭','懸浮倒三角','折線翼標','菱形下引'];
const notes=['兩條等長線段構成簡單向下箭頭。','主 V 加較淡的上層短 V，強調持續向下。','中空箭頭，肩部切角，尖端指向游標。','倒三角保留原版意象，改成冰藍細線輪廓。','加長兩側短翼，中央折向下方。','小菱形搭配下方 V，與目前游標造型呼應。'];
const grid=document.querySelector('.grid');const canvases=titles.map((title,i)=>{const s=document.createElement('section');s.innerHTML=`<h2>0${i+1}　${title}</h2><canvas aria-label="${title}長按提示原尺寸與三倍預覽"></canvas><p>${notes[i]}</p>`;grid.append(s);return s.querySelector('canvas')});
let motion=!matchMedia('(prefers-reduced-motion:reduce)').matches,showCursor=true;
function path(c,points,close=false){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));if(close)c.closePath();c.stroke()}
function cursor(c){c.save();c.lineWidth=1;c.lineJoin='miter';c.lineCap='round';c.shadowColor='#86d8f2';c.shadowBlur=3;const edge=c.createLinearGradient(-11,-11,11,11);edge.addColorStop(0,'#e0faff');edge.addColorStop(.42,'#91d9ed');edge.addColorStop(.72,'#579bb5');edge.addColorStop(1,'#b8ebfa');c.strokeStyle=edge;const fill=c.createLinearGradient(-7,-11,7,11);fill.addColorStop(0,'#294c60');fill.addColorStop(.5,'#142d3e');fill.addColorStop(1,'#07131f');c.fillStyle=fill;c.beginPath();c.moveTo(0,-11);c.lineTo(11,0);c.lineTo(0,11);c.lineTo(-11,0);c.closePath();c.fill();c.stroke();c.strokeStyle='#b9eaff';c.shadowBlur=2;for(let i=0;i<4;i++){c.save();c.rotate(i*Math.PI/2);path(c,[[0,-15],[0,-19]]);c.restore()}c.fillStyle='#dcfaff';c.shadowBlur=4;c.beginPath();c.arc(0,0,1.2,0,Math.PI*2);c.fill();c.restore()}
function indicator(c,k,t){c.save();c.translate(0,-32+(motion?Math.sin(t/125)*2:0));c.strokeStyle='#b9eaff';c.lineWidth=1.6;c.lineJoin='miter';c.lineCap='round';c.shadowColor='#86d8f2';c.shadowBlur=3;
if(k===0)path(c,[[-8,-4],[0,4],[8,-4]]);
if(k===1){c.save();c.globalAlpha=.45;path(c,[[-5,-8],[0,-3],[5,-8]]);c.restore();path(c,[[-8,-3],[0,5],[8,-3]])}
if(k===2)path(c,[[-8,-6],[-3,-6],[-3,-2],[3,-2],[3,-6],[8,-6],[8,-1],[0,6],[-8,-1]],true);
if(k===3){c.lineWidth=1.2;path(c,[[-8,-5],[8,-5],[0,6]],true)}
if(k===4)path(c,[[-11,-3],[-6,-3],[0,4],[6,-3],[11,-3]]);
if(k===5){c.lineWidth=1;path(c,[[0,-10],[4,-6],[0,-2],[-4,-6]],true);c.lineWidth=1.6;path(c,[[-7,0],[0,6],[7,0]])}
c.restore()}
function frame(t){canvases.forEach((el,k)=>{const r=el.getBoundingClientRect(),d=devicePixelRatio||1;if(el.width!==Math.round(r.width*d)||el.height!==Math.round(r.height*d)){el.width=Math.round(r.width*d);el.height=Math.round(r.height*d)}const c=el.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,r.width,r.height);for(const [x,z] of [[r.width*.23,1],[r.width*.65,3]]){c.save();c.translate(x,175);c.scale(z,z);if(showCursor)cursor(c);indicator(c,k,t);c.restore();c.fillStyle='#9ab1bf';c.font='13px system-ui';c.textAlign='center';c.fillText(z+'×',x,r.height-20)}});requestAnimationFrame(frame)}
function update(){document.querySelector('#motion').setAttribute('aria-pressed',motion);document.querySelector('#motion').textContent='浮動示意：'+(motion?'開':'關');document.querySelector('#cursor').setAttribute('aria-pressed',showCursor)}document.querySelector('#motion').onclick=()=>{motion=!motion;update()};document.querySelector('#cursor').onclick=()=>{showCursor=!showCursor;update()};update();requestAnimationFrame(frame);
</script></html>
