<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菱形點擊回饋 · 六組延伸</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#dceefa;font:15px system-ui}main{max-width:1400px;margin:auto;padding:32px 24px}h1{font-size:24px;font-weight:500}h2{font-size:17px;font-weight:500}p,small{color:#9ab1bf;line-height:1.6}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button{background:#122934;color:#c5edfa;border:1px solid #547784;padding:12px 18px;cursor:pointer;border-radius:0}button:focus{outline:none}button:focus-visible,button[aria-pressed=true]{box-shadow:inset 0 0 12px #86d8f255;color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}section{min-width:0}canvas{display:block;width:100%;height:240px;background:radial-gradient(ellipse at top left,#86d8f218,transparent 65%),repeating-linear-gradient(135deg,transparent 0 25px,#86d8f20b 26px 27px),#0a1922;border-block:1px solid #86d8f240;touch-action:manipulation}section button{margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style>
<main><small>ECHOES / CLICK FEEDBACK STUDY</small><h1>01 菱形延伸 · 六組動態候選</h1><div class="controls"><button id="replay">全部重播</button><button id="loop" aria-pressed="true">循環播放：開</button><button id="scale" aria-pressed="false">檢視：1×</button></div><div class="grid"></div><p>點擊各畫面可在該位置重播；04 為 350ms 線性播放，其餘為 900ms，循環間隔 700ms。預覽不觸發遊戲移動或音效，主專案未更動。</p></main>
<script>
const titles=['雙菱回聲','內聚外放','三層漣漪','四角解構','菱形光掃','落印脈衝'];
const descriptions=['保留雙菱波紋，次圈延遲追隨主圈。','大菱形先向落點收束，再釋放向外波紋。','三道菱形依序擴散，逐層減弱亮度。','完整菱形先顯現，再拆成四個向外漂移的尖角。','沿菱形輪廓掃過一段高光，再擴散淡出。','小菱形落下定位，接觸瞬間激發雙層菱形波紋。'];
const grid=document.querySelector('.grid');let loop=!matchMedia('(prefers-reduced-motion:reduce)').matches,zoom=1;
const items=[...titles,...titles].map((title,index)=>{const i=index%6,isDenied=index>=6;const section=document.createElement('section');section.innerHTML=`<h2>${isDenied?'不可互動 · 紅色':'可互動 · 藍色'} 0${i+1}　${title}</h2><canvas aria-label="${isDenied?'不可互動':'可互動'} ${title}動態預覽"></canvas><button>重播 0${i+1}</button><p>${descriptions[i]}</p>`;grid.append(section);const canvas=section.querySelector('canvas'),item={canvas,start:performance.now(),point:null,isDenied,kind:i};section.querySelector('button').onclick=()=>{item.start=performance.now()};canvas.onpointerdown=e=>{const r=canvas.getBoundingClientRect();item.point={x:Math.max(60,Math.min(r.width-60,e.clientX-r.left)),y:Math.max(65,Math.min(r.height-60,e.clientY-r.top))};item.start=performance.now()};return item;});
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-(1-clamp(x))**3;
function ring(c,r){c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke()}
function diamond(c,r){c.beginPath();c.moveTo(0,-r);c.lineTo(r,0);c.lineTo(0,r);c.lineTo(-r,0);c.closePath();c.stroke()}
function effect(c,k,p,denied){
const fade=1-clamp((p-.55)/.45),alpha=Math.min(1,p/.06)*fade;
c.globalAlpha=alpha;c.strokeStyle=denied?'#ff9d94':'#a5e7fa';c.fillStyle=denied?'#ffe0dc':'#e0faff';c.shadowColor=denied?'#ff776d':'#86d8f2';c.shadowBlur=4;c.lineWidth=1;c.lineCap='round';c.lineJoin='miter';
const wave=(phase,from,to,opacity=1)=>{if(phase<0||phase>1)return;c.globalAlpha=alpha*opacity;diamond(c,from+(to-from)*ease(phase));};
if(k===0){wave(p,5,28);wave((p-.15)/.85,3,21,.55);}
if(k===1){if(p<.4){diamond(c,28-21*ease(p/.4));}else{wave((p-.4)/.6,7,29);wave((p-.5)/.5,4,16,.5);}}
if(k===2){for(let i=0;i<3;i++)wave((p-i*.13)/(1-i*.13),4,28-i*3,1-i*.25);}
if(k===3){c.lineWidth=1.6;const r=8+11*p,split=clamp((p-.2)/.8),gap=7*split,cut=.12*split;if(p<=.2){diamond(c,r);}else{for(let j=0;j<4;j++){c.save();c.rotate(j*Math.PI/2);c.translate(gap/Math.SQRT2,-gap/Math.SQRT2);c.beginPath();c.moveTo(r*cut,-r*(1-cut));c.lineTo(r*(1-cut),-r*cut);c.stroke();c.restore();}}}
if(k===4){const r=9+13*ease(p);c.globalAlpha=alpha*.35;diamond(c,r);const vertices=[[0,-r],[r,0],[0,r],[-r,0],[0,-r]];const pathPoint=t=>{const q=((t%1)+1)%1*4,i=Math.floor(q),f=q-i;return [vertices[i][0]*(1-f)+vertices[i+1][0]*f,vertices[i][1]*(1-f)+vertices[i+1][1]*f];};c.globalAlpha=alpha;c.strokeStyle=denied?'#ffe0dc':'#e0faff';c.shadowBlur=6;c.beginPath();for(let i=0;i<=24;i++){const v=pathPoint(p*1.3-i*.012);if(i===0)c.moveTo(...v);else c.lineTo(...v);}c.stroke();}
if(k===5){if(p<.42){c.save();c.translate(0,-22*(1-ease(p/.42)));diamond(c,5);c.restore();}else{wave((p-.42)/.58,5,28);wave((p-.52)/.48,3,16,.5);}}
c.globalAlpha=fade;c.shadowBlur=3;
if(denied){c.lineWidth=1.3;c.beginPath();c.moveTo(-3,-3);c.lineTo(3,3);c.moveTo(3,-3);c.lineTo(-3,3);c.stroke();}else{c.beginPath();c.arc(0,0,1.3,0,Math.PI*2);c.fill();}
}
function frame(now){items.forEach((item,k)=>{const el=item.canvas,r=el.getBoundingClientRect(),d=devicePixelRatio||1;if(el.width!==Math.round(r.width*d)||el.height!==Math.round(r.height*d)){el.width=Math.round(r.width*d);el.height=Math.round(r.height*d)}const c=el.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,r.width,r.height);let elapsed=now-item.start;const duration=item.kind===3?350:900;if(loop&&elapsed>=duration+700){item.start=now;elapsed=0}if(elapsed<=duration){c.save();c.translate(item.point?.x??r.width/2,item.point?.y??r.height/2);c.scale(zoom,zoom);effect(c,item.kind,clamp(elapsed/duration),item.isDenied);c.restore();}});requestAnimationFrame(frame)}
document.querySelector('#replay').onclick=()=>items.forEach(i=>i.start=performance.now());
document.querySelector('#loop').onclick=e=>{loop=!loop;e.currentTarget.setAttribute('aria-pressed',loop);e.currentTarget.textContent='循環播放：'+(loop?'開':'關');if(loop)document.querySelector('#replay').click()};
document.querySelector('#scale').onclick=e=>{zoom=zoom===1?2:1;e.currentTarget.setAttribute('aria-pressed',zoom===2);e.currentTarget.textContent='檢視：'+zoom+'×';document.querySelector('#replay').click()};
if(!loop){document.querySelector('#loop').textContent='循環播放：關';document.querySelector('#loop').setAttribute('aria-pressed','false')}requestAnimationFrame(frame);
</script></html>
