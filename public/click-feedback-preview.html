<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>點擊回饋 Tween · 六款候選</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#dceefa;font:15px system-ui}main{max-width:1400px;margin:auto;padding:32px 24px}h1{font-size:24px;font-weight:500}h2{font-size:17px;font-weight:500}p,small{color:#9ab1bf;line-height:1.6}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button{background:#122934;color:#c5edfa;border:1px solid #547784;padding:12px 18px;cursor:pointer;border-radius:0}button:focus{outline:none}button:focus-visible,button[aria-pressed=true]{box-shadow:inset 0 0 12px #86d8f255;color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}section{min-width:0}canvas{display:block;width:100%;height:240px;background:radial-gradient(ellipse at top left,#86d8f218,transparent 65%),repeating-linear-gradient(135deg,transparent 0 25px,#86d8f20b 26px 27px),#0a1922;border-block:1px solid #86d8f240;touch-action:manipulation}section button{margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style>
<main><small>ECHOES / CLICK FEEDBACK STUDY</small><h1>點擊地點回饋 · 六款動態候選</h1><div class="controls"><button id="replay">全部重播</button><button id="loop" aria-pressed="true">循環播放：開</button><button id="scale" aria-pressed="false">檢視：1×</button></div><div class="grid"></div><p>點擊各畫面可在該位置重播；每款 900ms，循環間隔 700ms。預覽不觸發遊戲移動或音效，主專案未更動。</p></main>
<script>
const titles=['菱形波紋','四弧聚焦','切角框鎖定','雙環擴散','四向匯聚','菱形落點'];
const descriptions=['小菱形向外舒展，中心光點短暫停留。','四段弧線從外向內收束，再向外淡出。','四個切角框靠近落點，停頓後消隱。','主環與延遲次環交錯擴散，輕量水波感。','四向短線匯聚成十字，外弧回應落點。','實心菱形垂直落下，接觸地面後釋放扁平光環。'];
const grid=document.querySelector('.grid');let loop=!matchMedia('(prefers-reduced-motion:reduce)').matches,zoom=1;
const items=[...titles,...titles].map((title,index)=>{const i=index%6,isDenied=index>=6;const section=document.createElement('section');section.innerHTML=`<h2>${isDenied?'不可互動 · 紅色':'可互動 · 藍色'} 0${i+1}　${title}</h2><canvas aria-label="${isDenied?'不可互動':'可互動'} ${title}動態預覽"></canvas><button>重播 0${i+1}</button><p>${descriptions[i]}</p>`;grid.append(section);const canvas=section.querySelector('canvas'),item={canvas,start:performance.now(),point:null,isDenied,kind:i};section.querySelector('button').onclick=()=>{item.start=performance.now()};canvas.onpointerdown=e=>{const r=canvas.getBoundingClientRect();item.point={x:Math.max(60,Math.min(r.width-60,e.clientX-r.left)),y:Math.max(65,Math.min(r.height-60,e.clientY-r.top))};item.start=performance.now()};return item;});
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-(1-clamp(x))**3;
function ring(c,r){c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke()}
function diamond(c,r){c.beginPath();c.moveTo(0,-r);c.lineTo(r,0);c.lineTo(0,r);c.lineTo(-r,0);c.closePath();c.stroke()}
function effect(c,k,p,denied){const enter=ease(p/.38),fade=1-clamp((p-.5)/.5);c.globalAlpha=Math.min(1,p/.06)*fade;c.strokeStyle=denied?'#ff9d94':'#a5e7fa';c.fillStyle=denied?'#ffe0dc':'#e0faff';c.shadowColor=denied?'#ff776d':'#86d8f2';c.shadowBlur=4;c.lineWidth=1;c.lineCap='round';
if(k===0){diamond(c,5+23*ease(p));c.globalAlpha*=.55;diamond(c,3+11*ease(p));}
if(k===1){const r=29-17*enter+5*ease((p-.55)/.45);for(let j=0;j<4;j++){const a=j*Math.PI/2+.28;c.beginPath();c.arc(0,0,r,a,a+Math.PI/2-.56);c.stroke();}}
if(k===2){const r=30-17*enter;for(let j=0;j<4;j++){c.save();c.rotate(j*Math.PI/2);c.beginPath();c.moveTo(r-7,-r);c.lineTo(r-2,-r);c.lineTo(r,-r+2);c.lineTo(r,-r+7);c.stroke();c.restore();}}
if(k===3){ring(c,4+25*ease(p));if(p>.16){c.globalAlpha*=.55;ring(c,4+19*ease((p-.16)/.84));}}
if(k===4){const r=24-20*enter;for(let j=0;j<4;j++){c.save();c.rotate(j*Math.PI/2);c.beginPath();c.moveTo(r,0);c.lineTo(r+7,0);c.stroke();c.restore();}c.globalAlpha*=.5;for(let j=0;j<4;j++){c.beginPath();c.arc(0,0,13,j*Math.PI/2+.4,(j+1)*Math.PI/2-.4);c.stroke();}}
if(k===5){const y=-30*(1-enter);c.save();c.translate(0,y-6);const g=c.createLinearGradient(0,-6,0,6);g.addColorStop(0,denied?'#75423e':'#294c60');g.addColorStop(1,'#07131f');c.fillStyle=g;c.beginPath();c.moveTo(0,-6);c.lineTo(6,0);c.lineTo(0,6);c.lineTo(-6,0);c.closePath();c.fill();c.stroke();c.restore();if(p>.25){c.save();c.scale(1,.5);ring(c,3+24*ease((p-.25)/.75));c.restore();}}
c.globalAlpha=fade;c.shadowBlur=3;if(denied){c.lineWidth=1.3;c.beginPath();c.moveTo(-3,-3);c.lineTo(3,3);c.moveTo(3,-3);c.lineTo(-3,3);c.stroke();}else if(k!==5){c.beginPath();c.arc(0,0,1.3,0,Math.PI*2);c.fill();}}
function frame(now){items.forEach((item,k)=>{const el=item.canvas,r=el.getBoundingClientRect(),d=devicePixelRatio||1;if(el.width!==Math.round(r.width*d)||el.height!==Math.round(r.height*d)){el.width=Math.round(r.width*d);el.height=Math.round(r.height*d)}const c=el.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,r.width,r.height);let elapsed=now-item.start;if(loop&&elapsed>=1600){item.start=now;elapsed=0}if(elapsed<=900){c.save();c.translate(item.point?.x??r.width/2,item.point?.y??r.height/2);c.scale(zoom,zoom);effect(c,item.kind,clamp(elapsed/900),item.isDenied);c.restore();}});requestAnimationFrame(frame)}
document.querySelector('#replay').onclick=()=>items.forEach(i=>i.start=performance.now());
document.querySelector('#loop').onclick=e=>{loop=!loop;e.currentTarget.setAttribute('aria-pressed',loop);e.currentTarget.textContent='循環播放：'+(loop?'開':'關');if(loop)document.querySelector('#replay').click()};
document.querySelector('#scale').onclick=e=>{zoom=zoom===1?2:1;e.currentTarget.setAttribute('aria-pressed',zoom===2);e.currentTarget.textContent='檢視：'+zoom+'×';document.querySelector('#replay').click()};
if(!loop){document.querySelector('#loop').textContent='循環播放：關';document.querySelector('#loop').setAttribute('aria-pressed','false')}requestAnimationFrame(frame);
</script></html>
