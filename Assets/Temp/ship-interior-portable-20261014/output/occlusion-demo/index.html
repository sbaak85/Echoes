<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>船艙 · 角色防遮擋示範</title>
<style>
:root{color-scheme:dark;font-family:'Microsoft JhengHei',system-ui,sans-serif;background:#0a1117;color:#dce7eb}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;border-bottom:1px solid #263c48;display:flex;align-items:center;justify-content:space-between;gap:20px}small{color:#8eb1c2;letter-spacing:.15em}h1{font-size:23px;font-weight:500;margin:6px 0 0}header p{color:#91a7b4;font-size:13px;margin:0}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:calc(100vh - 98px)}.scene{position:relative;min-width:0;min-height:560px;overflow:hidden;background:#070d12}canvas{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none}.scene .caption{position:absolute;left:24px;bottom:20px;max-width:80%;pointer-events:none;background:#0b1621dc;border-left:3px solid #d6b46b;padding:10px 14px;font-size:13px;line-height:1.7}.badge{position:absolute;top:20px;left:24px;color:#aed8df;background:#112532e8;padding:8px 12px;font-size:13px;pointer-events:none}aside{padding:23px;background:#111d27;border-left:1px solid #263c48}h2{font-size:14px;font-weight:500;margin:0 0 12px;color:#d2b87d}section+section{border-top:1px solid #29404c;margin-top:22px;padding-top:20px}button{font:inherit;font-size:13px;color:#d4e1e6;border:1px solid #365365;background:#1b303e;border-radius:6px;padding:11px 12px;cursor:pointer;min-height:42px;text-align:left}button:hover{background:#284657}button[aria-pressed=true]{border-color:#d7ba7a;background:#3a3d36;color:#ffe6b5}button:focus,button:focus-visible{outline:none;box-shadow:none}button[data-selected=true]{outline:2px solid #f2cf80;outline-offset:3px}body[data-owner=directional] *{cursor:none!important}.stack{display:grid;gap:8px}.row{display:flex;gap:7px;flex-wrap:wrap}.row button{flex:1;text-align:center}.note{font-size:12px;color:#8fa6b3;line-height:1.75;margin:12px 0 0}.live{font-size:14px;color:#b7d9dc;margin:12px 0;line-height:1.6}.key{font-size:12px;color:#a5bac4}.status{font-size:12px;color:#a9bac4;margin-top:22px;line-height:1.6}.legend{display:flex;gap:10px;align-items:center;margin-bottom:12px}.dot{width:10px;height:10px;background:#efc76f;border-radius:50%}#error{color:#ffb2a0} @media(max-width:820px){header{padding:15px 18px}header p{display:none}main{grid-template-columns:1fr}aside{border:0;border-top:1px solid #263c48;display:grid;grid-template-columns:1fr 1fr;gap:18px}.scene{height:59vh;min-height:370px}section+section{margin:0;padding:0;border:0}.status{grid-column:1/-1;margin:0}h1{font-size:20px}button{min-height:44px}}@media(max-width:450px){aside{grid-template-columns:1fr}.scene .caption{left:10px;bottom:10px;font-size:12px}.badge{left:10px}}
.scene-actions{position:absolute;top:62px;left:24px;display:flex;gap:8px}.scene-actions button{background:#132936ed}.scene-actions button[aria-pressed=true]{background:#3a3d36ed}@media(max-width:450px){.scene-actions{left:10px;top:58px}}
</style>
<header><div><small>ECHOES / OCCLUSION STUDY</small><h1>角色被牆擋住時，局部讓開視線</h1></div><p>用你的兩張船艙圖，示範一段駕駛艙隔牆</p></header>
<main><div class="scene"><canvas id="map" aria-label="船艙防遮擋示範，點選地板移動角色">互動船艙：使用右方按鈕將角色放在牆後或牆前。</canvas><div class="badge" id="badge">載入圖片…</div><div class="scene-actions"><button id="effect" aria-pressed="true">防遮擋：開</button><button id="walk" aria-pressed="false">沿牆行走</button></div><div class="caption" id="caption">無牆底圖 → 人物 → 只有牆的圖層</div></div>
<aside><section><h2>01　看圖層怎麼疊</h2><div class="stack"><button data-mode="composite" aria-pressed="true">疊在一起 · 實際效果</button><button data-mode="base" aria-pressed="false">底層 · 無牆場景</button><button data-mode="wall" aria-pressed="false">上層 · 只有裁出的隔牆</button></div><p class="note">這次只裁出一段隔牆。格子代表透明，沒有貼上整張「有牆圖」。</p></section>
<section><h2>02　讓人物被牆擋住</h2><div class="legend"><span class="dot"></span><span class="key">金色太空人＝示範角色</span></div><div class="row"><button id="behind">站到牆後</button><button id="front">站到牆前</button></div><div class="live" id="live" role="status">準備中</div><p class="note">點地板可移動人物。站到牆後，再切換「防遮擋」，比較身體是否被牆蓋住。</p></section>
<section><h2>03　看清楚遮罩</h2><div class="row"><button id="guide" aria-pressed="true">顯示透明範圍</button><button id="zoom" aria-pressed="true">近看隔牆</button></div><p class="note">透明只作用在隔牆，邊緣漸淡；角色站在牆前時，隔牆不透明。</p></section>
<div class="status">機制示範：尚未加入碰撞與尋路。兩張生成圖仍有細部差異，正式使用前需修齊底圖。<div id="error"></div></div></aside></main><script type="module" src="demo.js"></script></html>
